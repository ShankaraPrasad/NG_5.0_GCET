<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>sum of 2 numbers</h1>
    <input type="number" id="number1">
    <input type="number" id="number2">
    <button onclick="result() ">result</button>

    <h5 id="resulttag"></h5>

    <script>
        let fs=document.getElementById("number1");
        let ss=document.getElementById("number2");
        let status=document.getElementById("resulttag");
        function result(){
            let sum = parseInt(fs.value)+parseInt(ss.value);
            status.textContent="Total: "+sum;
        }

    </script>

</body>
</html>
